name: India External Publication Approval Request
description: Submit your paper, publication, or presentation for compliance review.
title: "[EXP-REQUEST] - [Title of Content] - [Author Name]"
labels: ["status: in-review", "region: India"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🏢 India ETC External Publication Approval Portal
        Please fill out this form to initiate the compliance and IP review sequence.
        *Note: Approvals from Manager, Legal, Communications, and External Partnerships are mandatory.*

  - type: input
    id: lead_author
    attributes:
      label: "👤 Lead Author / Presenter Name"
      placeholder: "e.g., Rahul Ottur"
    validations:
      required: true

  - type: input
    id: direct_manager
    attributes:
      label: "💼 Direct Manager (Mandatory Approver)"
      placeholder: "Enter Manager's Name / Email"
    validations:
      required: true

  - type: dropdown
    id: content_type
    attributes:
      label: "📄 Content Type"
      description: "Select the specific type of content being submitted."
      options:
        - "Paper"
        - "Publication"
        - "External Presentation"
        - "Abstract / Summary Only"
        - "Other"
    validations:
      required: true

  - type: input
    id: content_type_other
    attributes:
      label: "🔍 Specify Content Type (If 'Other' selected above)"
      placeholder: "Please describe your content type here..."
    validations:
      required: false

  - type: input
    id: presentation_date
    attributes:
      label: "📅 Scheduled Presentation / Submission Date (DD-MM-YYYY)"
      description: "Click to select the presentation date or final paper submission deadline from the calendar."
      placeholder: "DD-MM-YYYY"
    validations:
      required: true

  - type: dropdown
    id: lead_time_select
    attributes:
      label: "⏳ Review Lead-Time Selection"
      description: "Reviewers require a minimum of 2 weeks (14 days) lead time to properly evaluate submissions."
      options:
        - "I confirm that my submission date is AT LEAST 14 days from today (Standard Request)."
        - "⚠️ WARNING: My date is LESS than 14 days away (Expedited Timeline / Urgent Escalation)."
    validations:
      required: true

  - type: dropdown
    id: sme_requirement
    attributes:
      label: "🔬 SME / Technical Reviewer (Optional)"
      description: "Is an in-depth Subject Matter Expert (SME) technical review required for this topic?"
      options:
        - "No - Standard content, manager review sufficient"
        - "Yes - Contains technical performance claims / new data (SME review needed)"
    validations:
      required: true

  - type: input
    id: sme_email
    attributes:
      label: "Designated SME Corporate Email Address"
      description: "📢 Note: Please notify your designated SME directly to review and approve this ticket once submitted."
      placeholder: "e.g., sme.name@tranetechnologies.com"
    validations:
      required: false

  - type: textarea
    id: submission_draft
    attributes:
      label: "📎 Upload Draft Content (Manuscript / Slides / Abstract)"
      description: "Drag and drop your presentation slides, document, or abstract directly into this box."
      placeholder: "Attach your files here..."
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### 🚦 Review & Approval Order
        *Reviewers: Review the attached draft, leave your comments, and check your approval box below.*

        - [ ] **1. Direct Manager Approval** *(MANDATORY - Strategic & business alignment)*
        - [ ] **2. SME / Technical Peer Approval** *(OPTIONAL - Required only if technical claims exist)*
        - [ ] **3. Legal & IP Counsel Approval** *(MANDATORY - Patent, copyright & IP clearance)*
        - [ ] **4. Branding & Communications Approval** *(MANDATORY - Brand compliance & messaging)*
        - [ ] **5. External Partnerships Final Sign-Off** *(MANDATORY - India ETC gatekeeper clearance)*

        ---
        ### 📸 MANDATORY INDIA POST-EVENT DELIVERABLES (Hard Closure Gate)
        > ⚠️ **CRITICAL POLICY NOTICE:** This workflow **CANNOT BE CLOSED** until the event has concluded and the presenter uploads the mandatory proof items below.

        - [ ] **Post-Event Photographs:** Action photos or session screenshots of the active presentation uploaded below.
        - [ ] **Lessons Learned & Feedback:** Summary document detailing audience questions, feedback, and key learnings attached below.
        - [ ] **Final Archive Verification:** External Partnerships verification and final ticket closure.
