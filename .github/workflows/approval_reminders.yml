name: Send Approval Reminders

on:
  schedule:
    # Runs Monday through Friday at 03:30 UTC (9:00 AM IST)
    - cron: '30 3 * * 1-5'
  workflow_dispatch: # Allows you to run it manually anytime for testing

jobs:
  remind-approvers:
    runs-on: ubuntu-latest
    steps:
      - name: Check Pending Publication Reviews
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'status: in-review'
            });

            for (const issue of issues.data) {
              const body = issue.body || "";
              
              // Only send reminders if there are unchecked reviewer boxes
              if (body.includes("- [ ] **Gate")) {
                const commentBody = `### ⏰ Automated Reminder: Pending Publication Approval\n\n` +
                  `Hello Reviewers,\n\n` +
                  `This publication request is awaiting your review.\n\n` +
                  `🔗 **[Click here to review the draft and submit your approval](${issue.html_url})**\n\n` +
                  `*Note: Minimum lead time requires timely review. Please check your corresponding approval gate when complete.*`;

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: commentBody
                });
              }
            }
